# Bairro Cliente: a Ana (personagem padrão) e 7 clientes-cenário.
# Cada cliente-cenário prepara um incidente da spec; o atributo
# "cenario" diz qual. Todos os dados são fictícios.

proveniencia_padrao:
  fonte: CRM Bússola
  data: 2026-10-28
  responsavel: Time de Dados de Clientes
  confianca: alta

entidades:
