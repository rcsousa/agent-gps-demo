# Sistemas do banco e de operação.
# Cada sistema mora no bairro do domínio que serve: o CRM e o core com o
# cliente, o motor de risco e o cofre de consentimentos com as regras, o
# gateway com os pagamentos, a plataforma de vistorias com os parceiros.

proveniencia_padrao:
  fonte: Catálogo de sistemas (CMDB)
  data: 2026-10-20
  responsavel: Arquitetura Corporativa
  confianca: alta

entidades:
  - id: sistema-crm
    bairro: cliente
    tipo: Sistema
    nome: CRM Bússola
    descricao: Cadastro, perfil e histórico de relacionamento.
    atributos: { dono: Time de Dados de Clientes }
    estado: { status: ok, latencia_ms: 120 }
  - id: sistema-core-bancario
    bairro: cliente
    tipo: Sistema
    nome: Core bancário
    descricao: Contas, saldos e débitos.
    atributos: { dono: Tecnologia de Core }
    estado: { status: ok, latencia_ms: 200 }
  - id: sistema-motor-risco
    bairro: governanca
    tipo: Sistema
    nome: Motor de regras de risco
    descricao: Avalia elegibilidade, adequação e alçadas.
    atributos: { dono: Diretoria de Riscos }
    estado: { status: ok, latencia_ms: 250 }
  - id: sistema-cofre-consentimentos
    bairro: governanca
    tipo: Sistema
    nome: Cofre de consentimentos
    descricao: Guarda consentimentos e suas evidências.
    atributos: { dono: Encarregado de Dados (DPO) }
    estado: { status: ok, latencia_ms: 90 }
  - id: sistema-gateway-pagamentos
    bairro: pagamentos
    tipo: Sistema
    nome: Gateway de pagamentos
    descricao: Processa débito em conta, cartão e Pix.
    atributos: { dono: Meios de Pagamento }
    estado: { status: ok, latencia_ms: 350, custo_estimado: 0.01 }
  - id: sistema-registro-operacoes
    bairro: governanca
    tipo: Sistema
    nome: Sistema de registro de operações
    descricao: Registra aceites e apólices para fins regulatórios.
    atributos: { dono: Diretoria de Compliance }
    estado: { status: ok, latencia_ms: 300 }
  - id: sistema-vistoria
    bairro: parceiros
    tipo: Sistema
    nome: Plataforma de vistorias
    descricao: Agenda vistorias com empresas credenciadas.
    atributos: { dono: Operações de Seguros, prazo_tipico_dias: 3 }
    estado: { status: ok, latencia_ms: 600 }
