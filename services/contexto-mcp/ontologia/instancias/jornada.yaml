  - { de: rota-economica, tipo: PASSA_POR, para: parada-cotacao, atributos: { ordem: 6 } }
  - { de: rota-economica, tipo: PASSA_POR, para: parada-proposta, atributos: { ordem: 7 } }
  - { de: rota-economica, tipo: PASSA_POR, para: parada-pagamento, atributos: { ordem: 8 } }
