# Bairros (domínios) da cidade do Banco Bússola.
#
# Posições fixas, inspiradas no infográfico da demo: a plateia passa a
# reconhecer os lugares ao longo da apresentação. Mundo de 1000 × 700
# unidades, origem no canto superior esquerdo.
# Cores: paleta categórica de dados do Carbon, sem vermelho (reservado a
# incidentes) e sem laranja (cor da marca).

mundo: { largura: 1000, altura: 700 }

# --8<-- [start:bairros]
bairros:
  - id: cliente
    nome: Cliente
    cor: "#6929c4"      # Carbon purple 70
    poligono: [[60, 60], [330, 40], [360, 250], [90, 300]]
  - id: regulatorio
    nome: Regulatório
    cor: "#1192e8"      # Carbon cyan 50
    poligono: [[380, 30], [640, 30], [625, 205], [395, 220]]
  - id: produtos
    nome: Produtos
    cor: "#005d5d"      # Carbon teal 70
    poligono: [[690, 40], [950, 60], [940, 300], [700, 285]]
  - id: risco
    nome: Risco
    cor: "#9f1853"      # Carbon magenta 70
    poligono: [[395, 250], [655, 235], [665, 430], [405, 445]]
  - id: parceiros
    nome: Parceiros
    cor: "#198038"      # Carbon green 60
    poligono: [[340, 480], [650, 470], [655, 670], [345, 680]]
  - id: canais
    nome: Canais e operação
    cor: "#002d9c"      # Carbon blue 80
    poligono: [[700, 330], [960, 340], [950, 660], [705, 650]]
# --8<-- [end:bairros]

# Rio que corta a cidade na diagonal, à esquerda, como no infográfico.
rio: [[0, 330], [150, 380], [260, 470], [300, 560], [285, 700]]
