[project]
name = "contexto-mcp"
version = "0.1.0"
description = "Camada de contexto: ontologia, estado vivo, regras e proveniência"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "neo4j>=6.0", "networkx>=3.4", "numpy>=2.1", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contexto_mcp"]

[tool.pytest.ini_options]
markers = ["grafo: testes de integração que precisam do Neo4j no ar"]
