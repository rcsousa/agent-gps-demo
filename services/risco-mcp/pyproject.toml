[project]
name = "risco-mcp"
version = "0.1.0"
description = "Elegibilidade, adequação e alçadas"
requires-python = ">=3.12"
dependencies = ["bussola-comum"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risco_mcp"]
