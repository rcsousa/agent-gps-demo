server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirecionamentos relativos: funcionam com qualquer WEB_PORT no host.
    absolute_redirect off;

    # ------------------------------------------------------------ autenticação
    # Toda requisição precisa de sessão válida: o nginx pergunta ao serviço auth antes de servir.
    # Vale para qualquer location abaixo; só as exceções públicas dizem "auth_request off".
    auth_request /_sessao;
    # Páginas sem sessão recebem 401 com uma página mínima que leva à tela de login,
    # guardando o destino (caminho, busca e âncora) para voltar depois de entrar.
    error_page 401 /_entrar.html;

    location = /_sessao {
        internal;
        auth_request off;
        proxy_pass http://auth:8000/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /_entrar.html {
        internal;
        auth_request off;
        root /usr/share/nginx/publico;
        add_header Cache-Control "no-store" always;
    }

    # Chamadas de dados sem sessão: 401 em JSON (o front leva à tela de login).
    location @sem_sessao {
        auth_request off;
        default_type application/json;
        return 401 '{"erro":"sem_sessao"}';
    }

    # Públicos: a tela de login (um build à parte, sem nada da experiência) e o próprio login.
    location = /entrar {
        auth_request off;
        return 302 /entrar/$is_args$args;
    }
    location /entrar/ {
        auth_request off;
        root /usr/share/nginx/publico;
        try_files $uri /entrar/index.html;
    }
    location /auth/ {
        auth_request off;
        proxy_pass http://auth:8000/auth/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /favicon.svg {
        auth_request off;
    }

    # ------------------------------------------------------------ a experiência (com sessão)
    # API do agente. O web fala só com o agent.
    location /api/ {
        error_page 401 = @sem_sessao;
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        # Eventos das execuções chegam por SSE: sem buffer, direto para a tela.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    # Painel do apresentador: ações sobre o mundo simulado (fora do alcance do agente).
    location /simulador/ {
        error_page 401 = @sem_sessao;
        proxy_pass http://simulator:8000/;
        proxy_read_timeout 60s;
    }

    # Site de bastidores (serviço docs), embutido no web.
    location = /bastidores {
        return 301 /bastidores/;
    }
    location /bastidores/ {
        proxy_pass http://docs/;
    }

    # SPA: qualquer outra rota cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
