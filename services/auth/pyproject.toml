[project]
name = "auth"
version = "0.1.0"
description = "Login da demo: o nginx do web confere a sessão de cada requisição aqui"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "fastapi>=0.115"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]
