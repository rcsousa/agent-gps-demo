[project]
name = "smoke"
version = "0.1.0"
description = "Checagem ponta a ponta da demo, rodando na rede interna do compose"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "httpx>=0.28", "pytest>=8"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoke"]
