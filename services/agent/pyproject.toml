[project]
name = "agent"
version = "0.1.0"
description = "Host MCP: descobre skills, planeja, executa e emite eventos"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "fastapi>=0.115", "httpx>=0.28", "redis>=5", "anthropic>=1.0", "openai>=2.0", "sse-starlette>=2.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "fakeredis>=2.26"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
