[project]
name = "skills-mcp"
version = "0.1.0"
description = "Catálogo de skills-workflow (extensão io.modelcontextprotocol/skills)"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.28"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mcp"]
