[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Ponto único de acesso MCP: agrega, governa e observa"
requires-python = ">=3.12"
dependencies = ["bussola-comum", "fastapi>=0.115", "httpx>=0.28", "pyyaml>=6", "redis>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "fakeredis>=2.26"]

[tool.uv.sources]
bussola-comum = { path = "../../libs/bussola_comum" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
