[project]
name = "bussola-comum"
version = "0.1.0"
description = "Utilitários compartilhados pelos serviços Python da demo GPS de Contexto"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "starlette>=0.40",
    "mcp==2.3.0",
    "uvicorn[standard]>=0.32",
    "redis>=5",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bussola_comum"]
