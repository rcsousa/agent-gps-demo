# Demo GPS de Contexto — Banco Bússola
# Sobe tudo com: docker compose up -d --build
# Fluxo: web ↔ agent → mcp-gateway → servidores MCP → graph

name: bussola

x-python-servico: &python-servico
  restart: unless-stopped
  networks: [bussola]
  environment: &python-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  healthcheck: &python-saude
    test: ["CMD", "python", "-m", "bussola_comum.healthcheck", "http://localhost:8000/saude"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 10s

x-build-python: &build-python
  context: .
  dockerfile: docker/python-service.Dockerfile

# Domínios leem o estado vivo (incidentes) e guardam seus registros no barramento.
x-dominio:
  environment: &dominio-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    BUS_URL: redis://bus:6379/0
  depends_on: &dominio-deps
    bus: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- front
  web:
    # Contexto na raiz: o build gera os tiles do infográfico (docs/assets) para a tela de abertura.
    build: { context: ., dockerfile: services/web/Dockerfile }
    restart: unless-stopped
    networks: [bussola]
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      agent: { condition: service_healthy }
      docs: { condition: service_healthy }
      simulator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  docs:
    build:
      context: .
      dockerfile: services/docs/Dockerfile
    restart: unless-stopped
    networks: [bussola]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------- agente
  agent:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: agent, MODULE: agent } }
    # As gravações das cenas (replay offline) ficam versionadas no repositório.
    volumes:
      - ./gravacoes:/gravacoes
    environment:
      <<: *python-env
      # O agente conhece só o gateway e o barramento.
      GATEWAY_URL: http://mcp-gateway:8000
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      BUS_URL: redis://bus:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_PLATAFORMA: ${ANTHROPIC_PLATAFORMA:-foundry}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FOUNDRY_BASE_URL: ${ANTHROPIC_FOUNDRY_BASE_URL:-}
      ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_MODELOS: ${ANTHROPIC_MODELOS:-}
      LLM_PRECOS: ${LLM_PRECOS:-}
      CACHE_LEITURA_FATOR: ${CACHE_LEITURA_FATOR:-0.1}
      CACHE_ESCRITA_FATOR: ${CACHE_ESCRITA_FATOR:-1.25}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS:-true}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      DEMO_MODO: ${DEMO_MODO:-ao_vivo}
    depends_on:
      mcp-gateway: { condition: service_healthy }
      bus: { condition: service_healthy }

  # ---------------------------------------------------------------- gateway
  mcp-gateway:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: mcp-gateway, MODULE: mcp_gateway } }
    environment:
      <<: *python-env
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      BUS_URL: redis://bus:6379/0
    depends_on:
      bus: { condition: service_healthy }
      skills-mcp: { condition: service_healthy }
      contexto-mcp: { condition: service_healthy }
      cliente-mcp: { condition: service_healthy }
      consentimento-mcp: { condition: service_healthy }
      risco-mcp: { condition: service_healthy }
      seguradoras-mcp: { condition: service_healthy }
      pagamentos-mcp: { condition: service_healthy }
      atendimento-mcp: { condition: service_healthy }
      canais-mcp: { condition: service_healthy }

  # ---------------------------------------------------------------- servidores MCP
  skills-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: skills-mcp, MODULE: skills_mcp } }

  contexto-mcp:
    <<: *python-servico
    image: bussola-contexto-mcp
    build: { <<: *build-python, args: { SERVICE: contexto-mcp, MODULE: contexto_mcp } }
    environment: &neo4j-env
      <<: *python-env
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SIMULADOR_TOKEN: ${SIMULADOR_TOKEN}
    depends_on:
      graph: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  # Recarrega o grafo com o estado-base da ontologia a cada subida e termina.
  # Usa a mesma imagem do contexto-mcp.
  seed:
    image: bussola-contexto-mcp
    build: { <<: *build-python, args: { SERVICE: contexto-mcp, MODULE: contexto_mcp } }
    networks: [bussola]
    restart: "no"
    environment: *neo4j-env
    command: ["python", "-m", "contexto_mcp.seed"]
    depends_on:
      graph: { condition: service_healthy }

  cliente-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: cliente-mcp, MODULE: cliente_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  consentimento-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: consentimento-mcp, MODULE: consentimento_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  risco-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: risco-mcp, MODULE: risco_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  seguradoras-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: seguradoras-mcp, MODULE: seguradoras_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  pagamentos-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: pagamentos-mcp, MODULE: pagamentos_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  atendimento-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: atendimento-mcp, MODULE: atendimento_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  canais-mcp:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: canais-mcp, MODULE: canais_mcp } }
    environment: *dominio-env
    depends_on: *dominio-deps

  # ---------------------------------------------------------------- mundo simulado
  simulator:
    <<: *python-servico
    build: { <<: *build-python, args: { SERVICE: simulator, MODULE: simulator } }
    environment:
      <<: *python-env
      BUS_URL: redis://bus:6379/0
      CONTEXTO_URL: http://contexto-mcp:8000
      SIMULADOR_TOKEN: ${SIMULADOR_TOKEN}
    depends_on:
      bus: { condition: service_healthy }
      contexto-mcp: { condition: service_healthy }

  # ---------------------------------------------------------------- infraestrutura
  graph:
    image: neo4j:5-community
    restart: unless-stopped
    networks: [bussola]
    ports:
      - "${NEO4J_BROWSER_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - graph-dados:/data
    # Healthcheck leve: a interface HTTP só responde quando o servidor terminou de subir.
    # O cypher-shell (uma JVM a cada checagem) passava dos 5 s em VMs de 2 vCPUs e deixava o
    # grafo "unhealthy" com o banco no ar. A senha é conferida pelo seed, logo em seguida.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Barramento de eventos (Redis Streams): route.planned, tool.called, ...
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [bussola]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bus-dados:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------- testes
  # docker compose --profile test run --rm --build smoke
  smoke:
    profiles: [test]
    build: { <<: *build-python, args: { SERVICE: smoke, MODULE: smoke } }
    networks: [bussola]
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    command: ["pytest", "-v"]
    depends_on:
      web: { condition: service_healthy }
      simulator: { condition: service_healthy }

  # docker compose --profile test run --rm --build e2e   (navegador; usa o roteiro, sem tokens)
  e2e:
    profiles: [test]
    build: { context: services/e2e }
    networks: [bussola]
    depends_on:
      web: { condition: service_healthy }
      simulator: { condition: service_healthy }

networks:
  bussola:

volumes:
  graph-dados:
  bus-dados:
